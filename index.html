<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="A minimalist content calendar for planning posts across brands and creators.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%227%22 fill=%22%2337352f%22/%3E%3Ctext x=%2216%22 y=%2222%22 font-size=%2218%22 font-family=%22Arial%22 font-weight=%22700%22 fill=%22white%22 text-anchor=%22middle%22%3EB%3C/text%3E%3C/svg%3E">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
<title>Batchbook</title>
<meta name="claude:viewport-fit-sides" content="cover">
</head>
<body>
<style>
/* Layout: Notion-style workspace. Idea inbox on the left, month or week calendar filling the rest, a page-peek drawer on the right for editing one idea. */
:root {
  --bg: #ffffff;
  --side: #f7f7f5;
  --fg: #37352f;
  --muted: #787774;
  --faint: #a5a29c;
  --line: #e9e9e7;
  --hover: rgba(55,53,47,.06);
  --card: #ffffff;
  --shadow: 0 0 0 1px rgba(15,15,15,.07), 0 2px 4px rgba(15,15,15,.06);
  --accent: #2383e2;
  --accent-soft: rgba(35,131,226,.12);
  --today: #eb5757;
  --danger: #d44c47;
  --font: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", Helvetica, Arial, sans-serif;
  --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;

  --t-gray-bg: #e3e2e0; --t-gray-fg: #32302c; --t-gray-dot: #9b9a97;
  --t-brown-bg: #eee0da; --t-brown-fg: #442a1e; --t-brown-dot: #a27763;
  --t-orange-bg: #fadec9; --t-orange-fg: #49290e; --t-orange-dot: #d9730d;
  --t-yellow-bg: #fdecc8; --t-yellow-fg: #402c1b; --t-yellow-dot: #cb912f;
  --t-green-bg: #dbeddb; --t-green-fg: #1c3829; --t-green-dot: #448361;
  --t-blue-bg: #d3e5ef; --t-blue-fg: #183347; --t-blue-dot: #337ea9;
  --t-purple-bg: #e8deee; --t-purple-fg: #412454; --t-purple-dot: #9065b0;
  --t-pink-bg: #f5e0e9; --t-pink-fg: #4c2337; --t-pink-dot: #c14c8a;
  --t-red-bg: #ffe2dd; --t-red-fg: #5d1715; --t-red-dot: #d44c47;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #191919; --side: #202020; --fg: #e6e6e4; --muted: #9b9b9b; --faint: #6f6f6f; --line: #2f2f2f;
    --hover: rgba(255,255,255,.055); --card: #252525; --shadow: 0 0 0 1px rgba(255,255,255,.07), 0 2px 4px rgba(0,0,0,.3);
    --accent: #529cca; --accent-soft: rgba(82,156,202,.18); --today: #ff7369; --danger: #ff7369;
    --t-gray-bg: #3a3a3a; --t-gray-fg: #ebebea; --t-gray-dot: #9b9b9b;
    --t-brown-bg: #4a3a32; --t-brown-fg: #f1e3dc; --t-brown-dot: #ba856f;
    --t-orange-bg: #5c3b23; --t-orange-fg: #fbe2cf; --t-orange-dot: #ffa344;
    --t-yellow-bg: #56452a; --t-yellow-fg: #fcefd2; --t-yellow-dot: #ffdc49;
    --t-green-bg: #2b4535; --t-green-fg: #dcf0e1; --t-green-dot: #4dab9a;
    --t-blue-bg: #28456c; --t-blue-fg: #d6e8f7; --t-blue-dot: #529cca;
    --t-purple-bg: #492f64; --t-purple-fg: #ece0f5; --t-purple-dot: #9a6dd7;
    --t-pink-bg: #4e2c3c; --t-pink-fg: #f7e1ec; --t-pink-dot: #e255a1;
    --t-red-bg: #5e2d2a; --t-red-fg: #ffe1dc; --t-red-dot: #ff7369;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #191919; --side: #202020; --fg: #e6e6e4; --muted: #9b9b9b; --faint: #6f6f6f; --line: #2f2f2f;
  --hover: rgba(255,255,255,.055); --card: #252525; --shadow: 0 0 0 1px rgba(255,255,255,.07), 0 2px 4px rgba(0,0,0,.3);
  --accent: #529cca; --accent-soft: rgba(82,156,202,.18); --today: #ff7369; --danger: #ff7369;
  --t-gray-bg: #3a3a3a; --t-gray-fg: #ebebea; --t-gray-dot: #9b9b9b;
  --t-brown-bg: #4a3a32; --t-brown-fg: #f1e3dc; --t-brown-dot: #ba856f;
  --t-orange-bg: #5c3b23; --t-orange-fg: #fbe2cf; --t-orange-dot: #ffa344;
  --t-yellow-bg: #56452a; --t-yellow-fg: #fcefd2; --t-yellow-dot: #ffdc49;
  --t-green-bg: #2b4535; --t-green-fg: #dcf0e1; --t-green-dot: #4dab9a;
  --t-blue-bg: #28456c; --t-blue-fg: #d6e8f7; --t-blue-dot: #529cca;
  --t-purple-bg: #492f64; --t-purple-fg: #ece0f5; --t-purple-dot: #9a6dd7;
  --t-pink-bg: #4e2c3c; --t-pink-fg: #f7e1ec; --t-pink-dot: #e255a1;
  --t-red-bg: #5e2d2a; --t-red-fg: #ffe1dc; --t-red-dot: #ff7369;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font: 14px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-radius: 4px; }

.app { display: grid; grid-template-columns: 300px minmax(0, 1fr); height: 100%; }

/* ---------- sidebar ---------- */
.side { background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.side-head { padding: 18px 14px 10px max(14px, env(safe-area-inset-left, 0px)); display: grid; gap: 10px; }
.ws { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; }
.ws-mark { width: 22px; height: 22px; border-radius: 5px; background: var(--fg); color: var(--bg); display: grid; place-items: center; font-size: 12px; font-weight: 700; }
.quick { background: var(--card); border-radius: 6px; box-shadow: var(--shadow); padding: 8px 10px; display: grid; gap: 6px; }
.quick textarea { border: 0; outline: 0; background: transparent; resize: none; width: 100%; min-height: 40px; line-height: 1.45; }
.quick textarea::placeholder { color: var(--faint); }
.quick-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px; color: var(--faint); }
.btn { border: 0; background: transparent; border-radius: 4px; padding: 4px 8px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn:hover { background: var(--hover); color: var(--fg); }
.btn.primary { background: var(--accent); color: #fff; }
.btn.primary:hover { background: var(--accent); filter: brightness(1.08); color: #fff; }
.btn.danger { color: var(--danger); }
.btn.danger.armed { background: var(--danger); color: #fff; }
.search { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 5px; padding: 5px 9px; outline: 0; }
.search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.tabs { display: flex; gap: 2px; }
.tab { border: 0; background: transparent; padding: 3px 8px; border-radius: 4px; color: var(--muted); font-size: 13px; }
.tab:hover { background: var(--hover); }
.tab[aria-pressed="true"] { background: var(--hover); color: var(--fg); font-weight: 500; }
.tab .n { color: var(--faint); font-variant-numeric: tabular-nums; margin-left: 3px; }
.tabs-row { display: flex; align-items: center; justify-content: space-between; gap: 6px; flex-wrap: wrap; }
.group-h { font-size: 12px; color: var(--muted); font-weight: 600; padding: 10px 4px 2px; display: flex; align-items: center; gap: 6px; }
.group-h .n { color: var(--faint); font-weight: 400; font-variant-numeric: tabular-nums; }
.group-h:first-child { padding-top: 2px; }
.quick.drop { box-shadow: 0 0 0 2px var(--accent); }

.list { flex: 1; overflow-y: auto; padding: 4px 10px 24px max(10px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 6px; min-height: 120px; transition: background .12s; }
.list.drop { background: var(--accent-soft); }
.empty { color: var(--faint); font-size: 13px; padding: 16px 6px; text-align: center; }

.idea { background: var(--card); border-radius: 6px; box-shadow: var(--shadow); padding: 8px 10px; display: grid; gap: 5px; cursor: grab; text-align: left; border: 0; width: 100%; }
.idea:hover { background: color-mix(in srgb, var(--card) 94%, var(--fg)); }
.idea:active { cursor: grabbing; }
.idea.dragging { opacity: .4; }
.idea-title { font-weight: 500; line-height: 1.35; overflow-wrap: anywhere; }
.idea-sub { color: var(--muted); font-size: 12px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; white-space: pre-line; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; }
.tag { font-size: 12px; line-height: 1; padding: 3px 6px; border-radius: 3px; background: var(--t-gray-bg); color: var(--t-gray-fg); white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.tag.when { background: transparent; color: var(--muted); padding-left: 0; }
.link-ico { font-size: 11px; color: var(--muted); }

/* ---------- main ---------- */
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 14px max(20px, env(safe-area-inset-right, 0px)) 12px 20px; border-bottom: 1px solid var(--line); }
.bar h1 { margin: 0 6px 0 0; font-size: 22px; font-weight: 700; letter-spacing: -.01em; min-width: 9.5ch; }
.nav { display: flex; align-items: center; gap: 2px; }
.nav .btn { padding: 3px 7px; }
.seg { display: inline-flex; border-radius: 5px; box-shadow: inset 0 0 0 1px var(--line); padding: 2px; }
.seg button { border: 0; background: transparent; border-radius: 3px; padding: 2px 9px; color: var(--muted); font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--fg); box-shadow: var(--shadow); }
.spacer { flex: 1; }
.filter { border: 0; background: transparent; color: var(--muted); border-radius: 4px; padding: 4px 6px; font-size: 13px; max-width: 160px; }
.filter:hover { background: var(--hover); color: var(--fg); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; padding: 8px max(20px, env(safe-area-inset-right, 0px)) 0 20px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; background: var(--t-gray-dot); }

.cal-wrap { flex: 1; overflow: auto; padding: 8px max(20px, env(safe-area-inset-right, 0px)) 24px 20px; min-height: 0; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-left: 1px solid var(--line); border-top: 1px solid var(--line); min-width: 560px; }
.dow { font-size: 12px; color: var(--muted); padding: 6px 8px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.day { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); min-height: 118px; padding: 4px 5px 6px; display: flex; flex-direction: column; gap: 3px; position: relative; min-width: 0; transition: background .1s; }
.day.out { background: color-mix(in srgb, var(--side) 60%, transparent); }
.day.out .num { color: var(--faint); }
.day.drop { background: var(--accent-soft); }
.day-head { display: flex; justify-content: space-between; align-items: center; height: 24px; }
.num { font-size: 13px; color: var(--muted); padding: 0 4px; font-variant-numeric: tabular-nums; }
.day.today .num { background: var(--today); color: #fff; border-radius: 999px; min-width: 22px; height: 22px; display: grid; place-items: center; padding: 0 6px; }
.add-day { opacity: 0; border: 0; background: transparent; color: var(--muted); border-radius: 4px; width: 22px; height: 22px; line-height: 1; font-size: 16px; }
.day:hover .add-day, .add-day:focus-visible { opacity: 1; }
.add-day:hover { background: var(--hover); }
.cal.week .day { min-height: 420px; }

.chip { background: var(--card); box-shadow: var(--shadow); border-radius: 4px; padding: 4px 6px; border: 0; text-align: left; width: 100%; display: grid; gap: 2px; cursor: grab; min-width: 0; }
.chip:hover { background: color-mix(in srgb, var(--card) 94%, var(--fg)); }
.chip-top { display: flex; align-items: center; gap: 5px; min-width: 0; }
.chip-title { font-size: 12.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.chip-meta { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip.posted .chip-title { color: var(--muted); text-decoration: line-through; }
.cal.week .chip-title { white-space: normal; }

/* ---------- drawer ---------- */
.scrim { position: fixed; inset: 0; background: rgba(15,15,15,.25); z-index: 20; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(520px, 100%); background: var(--bg); box-shadow: -1px 0 0 var(--line), -12px 0 32px rgba(15,15,15,.12); z-index: 21; display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); }
.drawer-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; }
.drawer-body { overflow-y: auto; padding: 8px 40px 40px; display: grid; gap: 16px; align-content: start; }
.d-title { font-size: 28px; font-weight: 700; line-height: 1.2; border: 0; outline: 0; background: transparent; width: 100%; padding: 0; resize: none; overflow: hidden; }
.d-title::placeholder { color: var(--faint); }
.props { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 2px 8px; align-items: center; }
.props label { color: var(--muted); font-size: 13.5px; padding: 5px 0; display: flex; align-items: center; gap: 6px; }
.prop { border: 0; background: transparent; border-radius: 4px; padding: 5px 6px; width: 100%; outline: 0; min-width: 0; }
.prop:hover { background: var(--hover); }
.prop:focus { background: var(--hover); box-shadow: 0 0 0 2px var(--accent-soft); }
.link-row { display: flex; align-items: center; gap: 4px; min-width: 0; }
.link-row a { color: var(--accent); font-size: 13px; flex: none; text-decoration: none; padding: 4px 6px; border-radius: 4px; }
.link-row a:hover { background: var(--hover); }
.divider { height: 1px; background: var(--line); }
.d-content { border: 0; outline: 0; background: transparent; width: 100%; min-height: 220px; resize: vertical; line-height: 1.6; padding: 0; }
.d-content::placeholder { color: var(--faint); }
.hint { font-size: 12px; color: var(--faint); }
.section-h { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.slides { display: grid; gap: 6px; }
.slide { display: grid; grid-template-columns: 58px minmax(0, 1fr) 26px; gap: 6px; align-items: start; }
.slide-n { font-size: 12.5px; color: var(--muted); padding-top: 7px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.slide textarea { border: 0; outline: 0; background: var(--side); border-radius: 6px; padding: 6px 9px; resize: none; width: 100%; line-height: 1.5; min-height: 34px; overflow: hidden; }
.slide textarea:focus { box-shadow: 0 0 0 2px var(--accent-soft); }
.slide textarea::placeholder { color: var(--faint); }
.slide .x { border: 0; background: transparent; color: var(--faint); border-radius: 4px; width: 26px; height: 30px; opacity: 0; font-size: 15px; }
.slide:hover .x, .slide .x:focus-visible { opacity: 1; }
.slide .x:hover { background: var(--hover); color: var(--danger); }
.ocr { border: 1px dashed var(--line); border-radius: 6px; padding: 9px 12px; font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }
.ocr.drop { border-color: var(--accent); background: var(--accent-soft); }
.ocr label { color: var(--accent); cursor: pointer; }
.ocr label:hover { text-decoration: underline; }
.ocr input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.ocr .busy { color: var(--fg); }
.menu { position: fixed; z-index: 30; min-width: 180px; background: var(--card); border-radius: 6px; box-shadow: 0 0 0 1px var(--line), 0 8px 24px rgba(15,15,15,.16); padding: 4px; display: grid; }
.menu button { border: 0; background: transparent; text-align: left; padding: 6px 10px; border-radius: 4px; font-size: 13.5px; }
.menu button:hover, .menu button:focus-visible { background: var(--hover); outline: 0; }
.menu button.danger { color: var(--danger); }

/* ---------- settings ---------- */
.modal { position: fixed; z-index: 21; top: 50%; left: 50%; transform: translate(-50%, -50%); width: min(620px, calc(100% - 32px)); max-height: calc(100% - 48px); overflow-y: auto; background: var(--bg); border-radius: 10px; box-shadow: 0 0 0 1px var(--line), 0 16px 48px rgba(15,15,15,.2); padding: 22px 24px; display: grid; gap: 18px; }
.modal h2 { margin: 0; font-size: 18px; }
.modal h3 { margin: 0; font-size: 13px; font-weight: 600; color: var(--muted); }
.rows { display: grid; gap: 4px; }
.row { display: grid; grid-template-columns: 26px minmax(0, 1.2fr) minmax(0, 1fr) minmax(0, 1fr) auto; gap: 6px; align-items: center; }
.row.brand { grid-template-columns: 26px minmax(0, 1fr) auto auto; }
.row input, .row select { border: 1px solid transparent; background: transparent; border-radius: 4px; padding: 4px 6px; width: 100%; min-width: 0; outline: 0; }
.row input:hover, .row select:hover { background: var(--hover); }
.row input:focus, .row select:focus { border-color: var(--accent); }
.swatch { width: 22px; height: 22px; border-radius: 4px; border: 0; padding: 0; }
.count { font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; white-space: nowrap; }

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 6px; font-size: 13px; z-index: 40; max-width: calc(100% - 32px); }
.mode { font-size: 11.5px; color: var(--faint); padding: 8px 14px calc(10px + env(safe-area-inset-bottom, 0px)) max(14px, env(safe-area-inset-left, 0px)); border-top: 1px solid var(--line); }

/* tag colors */
[data-c="gray"]   { --c-bg: var(--t-gray-bg);   --c-fg: var(--t-gray-fg);   --c-dot: var(--t-gray-dot); }
[data-c="brown"]  { --c-bg: var(--t-brown-bg);  --c-fg: var(--t-brown-fg);  --c-dot: var(--t-brown-dot); }
[data-c="orange"] { --c-bg: var(--t-orange-bg); --c-fg: var(--t-orange-fg); --c-dot: var(--t-orange-dot); }
[data-c="yellow"] { --c-bg: var(--t-yellow-bg); --c-fg: var(--t-yellow-fg); --c-dot: var(--t-yellow-dot); }
[data-c="green"]  { --c-bg: var(--t-green-bg);  --c-fg: var(--t-green-fg);  --c-dot: var(--t-green-dot); }
[data-c="blue"]   { --c-bg: var(--t-blue-bg);   --c-fg: var(--t-blue-fg);   --c-dot: var(--t-blue-dot); }
[data-c="purple"] { --c-bg: var(--t-purple-bg); --c-fg: var(--t-purple-fg); --c-dot: var(--t-purple-dot); }
[data-c="pink"]   { --c-bg: var(--t-pink-bg);   --c-fg: var(--t-pink-fg);   --c-dot: var(--t-pink-dot); }
[data-c="red"]    { --c-bg: var(--t-red-bg);    --c-fg: var(--t-red-fg);    --c-dot: var(--t-red-dot); }
.tag[data-c] { background: var(--c-bg); color: var(--c-fg); }
.dot[data-c], .swatch[data-c] { background: var(--c-dot); }

@media (max-width: 820px) {
  html, body { height: auto; }
  .app { grid-template-columns: minmax(0, 1fr); height: auto; }
  .side { border-right: 0; border-bottom: 1px solid var(--line); }
  .side-head { padding-right: max(14px, env(safe-area-inset-right, 0px)); }
  .list { max-height: 42vh; padding-right: max(10px, env(safe-area-inset-right, 0px)); }
  .bar, .legend, .cal-wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .drawer-body { padding: 8px 20px 40px; }
  .props { grid-template-columns: 96px minmax(0, 1fr); }
  .row { grid-template-columns: 26px minmax(0, 1fr) minmax(0, 1fr) auto; }
  .row .handle-in { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="app">
  <aside class="side" aria-label="Content ideas">
    <div class="side-head">
      <div class="ws"><span class="ws-mark">B</span>Batchbook</div>
      <div class="quick" id="quick-box">
        <textarea id="quick" rows="2" placeholder="Write an idea, paste a link, or paste a screenshot. One per line for several."></textarea>
        <div class="quick-row"><span id="quick-hint">Enter to add, Shift+Enter for a new line</span><button class="btn primary" id="quick-add" type="button">Add</button></div>
      </div>
      <input class="search" id="search" type="search" placeholder="Search ideas" aria-label="Search ideas">
      <div class="tabs-row">
        <div class="tabs" role="group" aria-label="Which ideas">
          <button class="tab" id="tab-un" type="button" aria-pressed="true">Unscheduled<span class="n" id="n-un">0</span></button>
          <button class="tab" id="tab-all" type="button" aria-pressed="false">All<span class="n" id="n-all">0</span></button>
        </div>
        <select class="filter" id="sort" aria-label="Sort ideas">
          <option value="persona">By persona, A–Z</option>
          <option value="az">A–Z</option>
          <option value="newest">Newest first</option>
          <option value="date">Post date</option>
        </select>
      </div>
    </div>
    <div class="list" id="list" aria-label="Idea list. Drop a scheduled post here to unschedule it."></div>
    <div class="mode" id="mode">Loading your calendar…</div>
  </aside>

  <main class="main">
    <div class="bar">
      <h1 id="label">October</h1>
      <div class="nav">
        <button class="btn" id="prev" type="button" aria-label="Previous">‹</button>
        <button class="btn" id="today" type="button">Today</button>
        <button class="btn" id="next" type="button" aria-label="Next">›</button>
      </div>
      <div class="seg" role="group" aria-label="Calendar view">
        <button type="button" id="v-month" aria-pressed="true">Month</button>
        <button type="button" id="v-week" aria-pressed="false">Week</button>
      </div>
      <span class="spacer"></span>
      <select class="filter" id="f-brand" aria-label="Filter by brand"></select>
      <select class="filter" id="f-creator" aria-label="Filter by creator"></select>
      <select class="filter" id="f-sell" aria-label="Filter by goal"></select>
      <button class="btn" id="open-settings" type="button">Brands &amp; creators</button>
    </div>
    <div class="legend" id="legend"></div>
    <div class="cal-wrap"><div class="cal" id="cal"></div></div>
  </main>
</div>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden aria-label="Idea details"></aside>
<section class="modal" id="settings" hidden aria-label="Brands and creators"></section>
<div class="toast" id="toast" hidden role="status"></div>
<div class="menu" id="menu" hidden role="menu"></div>

<script>
const COLORS = ["gray", "brown", "orange", "yellow", "green", "blue", "purple", "pink", "red"];
const SELL = { soft: { label: "Soft sell", c: "green" }, hard: { label: "Hard sell", c: "red" }, viral: { label: "Virality", c: "purple" } };
const STATUS = { idea: "Idea", ready: "Ready", posted: "Posted" };
const FORMATS = ["Carousel", "Single image", "Video", "Text post", "Thread"];
const LOCAL_KEY = "batchbook-v1";

const S = { brands: {}, creators: {}, ideas: {} };
const ui = { view: "month", cursor: startOfDay(new Date()), tab: "un", sort: "persona", q: "", brand: "", creator: "", sell: "", openId: null, mode: "loading", readOnly: false };
let db = null;

/* ---------- helpers ---------- */
function startOfDay(d) { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; }
const pad = n => String(n).padStart(2, "0");
const ymd = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const parseYmd = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const mondayOf = d => addDays(d, -((d.getDay() + 6) % 7));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = p => p + "_" + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
const $ = id => document.getElementById(id);
const fmtShort = s => parseYmd(s).toLocaleDateString(undefined, { month: "short", day: "numeric" });
const isUrl = s => /^https?:\/\/\S+$/i.test(s.trim());
const sortedVals = obj => Object.values(obj).sort((a, b) => (a.order ?? 0) - (b.order ?? 0) || String(a.name || "").localeCompare(String(b.name || "")));

let toastTimer;
function toast(msg) { const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 2600); }

/* ---------- storage: shared db when available, this browser otherwise ---------- */
const pending = {}, running = {};
function persist(col, id, data) {
  if (ui.mode === "local") { saveLocal(); return; }
  if (ui.mode !== "db") return;
  const key = col + "/" + id;
  pending[key] = data;
  if (running[key]) return;
  running[key] = true;
  (async () => {
    while (key in pending) {
      const body = pending[key]; delete pending[key];
      try {
        const ref = db.collection(col).doc(id);
        if (body === null) await ref.delete(); else await ref.set(body);
      } catch (e) { writeFailed(e); }
    }
    running[key] = false;
  })();
}
function writeFailed(e) {
  const code = e && e.code;
  if (code === "invalid_argument" || code === "not_granted") { ui.readOnly = true; toast("You can view this calendar, but you don't have edit access."); }
  else if (code === "quota_exceeded") toast("The calendar is full. Delete some old ideas to add new ones.");
  else toast("Couldn't save that change. Check your connection and try again.");
}
function put(col, obj) { S[col][obj.id] = obj; persist(col, obj.id, obj); renderAll(); }
function patch(col, id, fields) { const cur = S[col][id]; if (!cur) return; put(col, { ...cur, ...fields }); }
function remove(col, id) { delete S[col][id]; persist(col, id, null); renderAll(); }

async function boot() {
  renderAll();
  try { db = window.claude && claude.use ? await claude.use("db") : null; } catch (e) { db = null; }
  if (db) {
    ui.mode = "db";
    for (const col of ["brands", "creators", "ideas"]) {
      db.collection(col).onSnapshot(snap => {
        const next = {};
        snap.docs.forEach(d => { next[d.id] = { ...d.data(), id: d.id }; });
        S[col] = next;
        renderAll(true);
      }, () => { toast("Live updates stopped. Reload the page to reconnect."); });
    }
  } else {
    ui.mode = "local";
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem(LOCAL_KEY) || "null"); } catch (e) {}
    if (saved && saved.ideas) Object.assign(S, saved); else loadDemo();
  }
  renderAll();
}

/* ---------- demo content and backups (used when running outside Claude) ---------- */
function saveLocal() { try { localStorage.setItem(LOCAL_KEY, JSON.stringify(S)); } catch (e) {} }
function loadDemo() {
  const day = n => ymd(addDays(startOfDay(new Date()), n));
  S.brands = {
    ritual: { id: "ritual", name: "Morning Ritual Coffee", color: "brown", order: 0 },
    focusly: { id: "focusly", name: "Focusly", color: "purple", order: 1 },
  };
  S.creators = {
    ava: { id: "ava", name: "Ava", handle: "@ava.demo", brandId: "ritual", color: "orange", order: 0 },
    noah: { id: "noah", name: "Noah", handle: "@noah.demo", brandId: "ritual", color: "green", order: 1 },
    mia: { id: "mia", name: "Mia", handle: "@mia.demo", brandId: "focusly", color: "purple", order: 2 },
    leo: { id: "leo", name: "Leo", handle: "@leo.demo", brandId: "focusly", color: "blue", order: 3 },
  };
  const D = [
    ["ava", "3 coffee orders that say a lot about you", "viral", "Coffee culture", "Carousel", day(1), ["3 coffee orders that say a lot about you", "oat flat white · has a 5-year plan", "iced americano in winter · unbothered", "caramel everything · main character"]],
    ["noah", "My morning before 7am", "soft", "Routines", "Carousel", day(3), ["my morning before 7am", "6:00 · no phone, just water", "6:15 · walk around the block", "6:40 · first coffee, slowly"]],
    ["ava", "The autumn blend is back", "hard", "Product", "Single image", day(8), ["the autumn blend is back.\nonly until it's gone."]],
    ["noah", "POV: first sip on a Monday", "viral", "Relatable", "Single image", "", ["pov: the first sip on a monday morning"]],
    ["mia", "5 study apps I can't live without", "soft", "Productivity", "Carousel", day(2), ["5 study apps i can't live without", "1 · a timer that locks your phone", "2 · flashcards that repeat what you forget", "3 · a planner you actually open", "4 · focus music without ads", "5 · a notes app with search"]],
    ["leo", "What I planned vs what I did", "viral", "Relatable", "Carousel", day(5), ["what i planned to do today", "what i actually did"]],
    ["mia", "Focusly 2.0 is here", "hard", "Product", "Video", "", ["focusly 2.0 is here", "new: focus streaks", "new: study rooms with friends"]],
    ["leo", "How I stopped procrastinating", "soft", "Productivity", "Carousel", "", ["how i stopped procrastinating (for real)", "make the first step tiny", "work in 25-minute blocks", "never miss twice"]],
  ];
  S.ideas = {};
  D.forEach(([creatorId, title, sell, pillar, format, date, slides], k) => {
    const id = "demo-" + (k + 1);
    S.ideas[id] = { id, title, slides, content: "Demo idea. Edit it, duplicate it, or delete it.", link: "", brandId: S.creators[creatorId].brandId, creatorId, pillar, sell, format, date, status: date ? "ready" : "idea", order: k, createdAt: new Date(Date.now() - (D.length - k) * 60000).toISOString() };
  });
  S.demo = true;
  saveLocal();
}
function startFresh() {
  S.brands = { mybrand: { id: "mybrand", name: "My brand", color: "blue", order: 0 } };
  S.creators = {}; S.ideas = {}; S.demo = false;
  saveLocal(); closeDrawer(); renderAll(); renderSettings();
  toast("Calendar cleared. Add your brands and creators here.");
}
function exportBackup() {
  const data = { app: "batchbook", version: 1, exportedAt: new Date().toISOString(), brands: S.brands, creators: S.creators, ideas: S.ideas };
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: "application/json" }));
  a.download = "batchbook-backup-" + ymd(new Date()) + ".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
async function importBackup(file) {
  try {
    const data = JSON.parse(await file.text());
    if (!data || typeof data.ideas !== "object" || typeof data.creators !== "object" || typeof data.brands !== "object") throw new Error("shape");
    S.brands = data.brands; S.creators = data.creators; S.ideas = data.ideas; S.demo = false;
    saveLocal(); closeDrawer(); renderAll(); renderSettings();
    toast(`Restored ${Object.keys(S.ideas).length} ideas`);
  } catch (e) { toast("That file isn't a Batchbook backup."); }
}

/* ---------- filtering ---------- */
function brandOf(idea) { const c = S.creators[idea.creatorId]; return idea.brandId || (c && c.brandId) || ""; }
function matches(idea) {
  if (ui.brand && brandOf(idea) !== ui.brand) return false;
  if (ui.creator && idea.creatorId !== ui.creator) return false;
  if (ui.sell && idea.sell !== ui.sell) return false;
  if (ui.q) {
    const hay = [idea.title, idea.content, (idea.slides || []).join(" "), idea.pillar, idea.link, (S.creators[idea.creatorId] || {}).name].join(" ").toLowerCase();
    if (!hay.includes(ui.q.toLowerCase())) return false;
  }
  return true;
}
const ideaSort = (a, b) => (a.order ?? 0) - (b.order ?? 0) || String(a.createdAt || "").localeCompare(String(b.createdAt || ""));

/* ---------- render ---------- */
function renderAll(fromSnapshot) {
  renderFilters(); renderList(); renderCalendar(); renderLegend();
  $("mode").innerHTML = ui.mode === "db" ? "Saved to this calendar. Everyone with access sees the same plan." :
    ui.mode === "local" ? (S.demo ? `You're looking at demo content. <button class="btn" type="button" data-open-settings style="padding:0 4px;color:var(--accent)">Start your own</button>` : `Saved in this browser. <button class="btn" type="button" data-open-settings style="padding:0 4px;color:var(--accent)">Back up</button>`) : "Loading your calendar…";
  if (fromSnapshot && ui.openId && !S.ideas[ui.openId]) closeDrawer();
  if (!$("settings").hidden && !$("settings").contains(document.activeElement)) renderSettings();
}

function creatorTag(c) { return c ? `<span class="tag" data-c="${esc(c.color)}">${esc(c.name)}</span>` : ""; }
function sellTag(s) { const v = SELL[s]; return v ? `<span class="tag" data-c="${v.c}">${v.label}</span>` : ""; }

function renderList() {
  const all = Object.values(S.ideas).filter(matches);
  const un = all.filter(i => !i.date);
  $("n-un").textContent = un.length; $("n-all").textContent = all.length;
  const az = (a, b) => String(a.title || "").localeCompare(String(b.title || ""), undefined, { numeric: true, sensitivity: "base" });
  const sorters = {
    persona: az, az,
    newest: (a, b) => String(b.createdAt || "").localeCompare(String(a.createdAt || "")) || az(a, b),
    date: (a, b) => (a.date || "9").localeCompare(b.date || "9") || az(a, b),
  };
  const shown = (ui.tab === "un" ? un : all).sort(sorters[ui.sort] || az);
  const list = $("list");
  if (ui.mode === "loading") { list.innerHTML = `<div class="empty">Loading ideas…</div>`; return; }
  if (!shown.length) {
    list.innerHTML = `<div class="empty">${Object.keys(S.ideas).length ? (ui.tab === "un" ? "Everything here is scheduled. Write a new idea above, or drag a post off the calendar to unschedule it." : "No ideas match these filters.") : "No ideas yet. Write one above, paste a link, or paste a screenshot of a post you want to remake."}</div>`;
    return;
  }
  if (ui.sort === "persona") {
    const groups = sortedVals(S.creators).map(c => ({ c, items: shown.filter(i => i.creatorId === c.id) }));
    groups.push({ c: null, items: shown.filter(i => !S.creators[i.creatorId]) });
    list.innerHTML = groups.filter(g => g.items.length).map(g =>
      `<div class="group-h">${g.c ? `<i class="dot" data-c="${esc(g.c.color)}"></i>${esc(g.c.name)}` : "Unassigned"}<span class="n">${g.items.length}</span></div>` + g.items.map(ideaCard).join("")
    ).join("");
  } else list.innerHTML = shown.map(ideaCard).join("");
}
function slidesOf(i) { return Array.isArray(i.slides) ? i.slides : []; }
function ideaCard(i) {
    const c = S.creators[i.creatorId];
    const first = slidesOf(i).find(s => s && s.trim());
    const sub = first ? first.split("\n").filter(Boolean).slice(0, 2).join("\n") : i.content ? i.content.split("\n").filter(Boolean).slice(0, 2).join("\n") : (i.link || "");
    return `<button class="idea" type="button" draggable="true" data-id="${esc(i.id)}">
      <span class="idea-title">${esc(i.title || "Untitled")}${i.link ? ' <span class="link-ico" title="Has a link">↗</span>' : ""}</span>
      ${sub ? `<span class="idea-sub">${esc(sub)}</span>` : ""}
      <span class="tags">${i.date ? `<span class="tag when">${fmtShort(i.date)}</span>` : ""}${creatorTag(c)}${sellTag(i.sell)}${i.pillar ? `<span class="tag">${esc(i.pillar)}</span>` : ""}</span>
    </button>`;
}

function renderCalendar() {
  const cal = $("cal");
  const today = ymd(new Date());
  let start, days, label;
  if (ui.view === "month") {
    const first = new Date(ui.cursor.getFullYear(), ui.cursor.getMonth(), 1);
    start = mondayOf(first);
    const dim = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
    days = Math.ceil(((first.getDay() + 6) % 7 + dim) / 7) * 7;
    label = first.toLocaleDateString(undefined, { month: "long", year: "numeric" });
  } else {
    start = mondayOf(ui.cursor); days = 7;
    const end = addDays(start, 6);
    label = start.toLocaleDateString(undefined, { month: "short", day: "numeric" }) + " – " + end.toLocaleDateString(undefined, { month: start.getMonth() === end.getMonth() ? undefined : "short", day: "numeric", year: "numeric" });
  }
  $("label").textContent = label;
  cal.className = "cal" + (ui.view === "week" ? " week" : "");
  const byDate = {};
  Object.values(S.ideas).filter(i => i.date && matches(i)).sort(ideaSort).forEach(i => { (byDate[i.date] ||= []).push(i); });
  let html = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"].map((d, k) => `<div class="dow">${ui.view === "week" ? d + " " + addDays(start, k).getDate() : d}</div>`).join("");
  for (let k = 0; k < days; k++) {
    const d = addDays(start, k), key = ymd(d);
    const out = ui.view === "month" && d.getMonth() !== ui.cursor.getMonth();
    const num = d.getDate() === 1 && ui.view === "month" ? d.toLocaleDateString(undefined, { month: "short", day: "numeric" }) : d.getDate();
    html += `<div class="day${out ? " out" : ""}${key === today ? " today" : ""}" data-date="${key}">
      <div class="day-head"><span class="num">${num}</span><button class="add-day" type="button" data-add="${key}" aria-label="New idea on ${key}">+</button></div>
      ${(byDate[key] || []).map(chip).join("")}
    </div>`;
  }
  cal.innerHTML = html;
}
function chip(i) {
  const c = S.creators[i.creatorId];
  const meta = [c && c.name, SELL[i.sell] && SELL[i.sell].label, ui.view === "week" ? i.pillar : ""].filter(Boolean).join(" · ");
  return `<button class="chip${i.status === "posted" ? " posted" : ""}" type="button" draggable="true" data-id="${esc(i.id)}" title="${esc(i.title)}">
    <span class="chip-top"><span class="dot" data-c="${esc(c ? c.color : "gray")}"></span><span class="chip-title">${i.status === "posted" ? "✓ " : ""}${esc(i.title || "Untitled")}</span></span>
    ${meta ? `<span class="chip-meta">${esc(meta)}</span>` : ""}
  </button>`;
}
function renderLegend() {
  const cs = sortedVals(S.creators).filter(c => !ui.brand || c.brandId === ui.brand);
  $("legend").innerHTML = cs.map(c => `<span><i class="dot" data-c="${esc(c.color)}"></i>${esc(c.name)}${Object.keys(S.brands).length > 1 && S.brands[c.brandId] ? ` <span style="color:var(--faint)">${esc(S.brands[c.brandId].name)}</span>` : ""}</span>`).join("");
}
function renderFilters() {
  const keep = (sel, html, val) => { if (sel.dataset.html !== html) { sel.innerHTML = html; sel.dataset.html = html; } sel.value = val; };
  const brands = sortedVals(S.brands);
  if (ui.brand && !S.brands[ui.brand]) ui.brand = "";
  if (ui.creator && !S.creators[ui.creator]) ui.creator = "";
  keep($("f-brand"), `<option value="">All brands</option>` + brands.map(b => `<option value="${esc(b.id)}">${esc(b.name)}</option>`).join(""), ui.brand);
  const cs = sortedVals(S.creators).filter(c => !ui.brand || c.brandId === ui.brand);
  keep($("f-creator"), `<option value="">All creators</option>` + cs.map(c => `<option value="${esc(c.id)}">${esc(c.name)}</option>`).join(""), ui.creator);
  keep($("f-sell"), `<option value="">Any goal</option>` + Object.entries(SELL).map(([k, v]) => `<option value="${k}">${v.label}</option>`).join(""), ui.sell);
}

/* ---------- creating ideas ---------- */
function newIdea(fields) {
  const creator = ui.creator ? S.creators[ui.creator] : null;
  const brandId = creator ? creator.brandId : (ui.brand || (sortedVals(S.brands)[0] || {}).id || "");
  return { id: uid("idea"), title: "", slides: ["", ""], content: "", link: "", brandId, creatorId: creator ? creator.id : "", pillar: "", sell: "soft", format: "", date: "", status: "idea", order: Date.now(), createdAt: new Date().toISOString(), ...fields };
}
function titleFromUrl(u) {
  try { const x = new URL(u); const p = x.pathname.split("/").filter(Boolean); const at = p.find(s => s.startsWith("@")); return (at ? at + " on " : "") + x.hostname.replace(/^www\./, ""); } catch (e) { return u; }
}
function quickAdd() {
  if (ui.mode === "loading") return;
  const lines = $("quick").value.split("\n").map(s => s.trim()).filter(Boolean);
  if (!lines.length) return;
  let made = [];
  lines.forEach((line, k) => {
    const idea = isUrl(line) ? newIdea({ title: titleFromUrl(line), link: line, order: Date.now() + k }) : newIdea({ title: line, order: Date.now() + k });
    S.ideas[idea.id] = idea; persist("ideas", idea.id, idea); made.push(idea);
  });
  $("quick").value = "";
  ui.tab = "un"; syncTabs(); renderAll();
  toast(made.length === 1 ? "Idea added" : made.length + " ideas added");
  if (made.length === 1 && isUrl(lines[0])) openDrawer(made[0].id);
}

/* ---------- drawer ---------- */
function creatorOptions(sel) {
  const groups = sortedVals(S.brands).map(b => {
    const cs = sortedVals(S.creators).filter(c => c.brandId === b.id);
    return cs.length ? `<optgroup label="${esc(b.name)}">${cs.map(c => `<option value="${esc(c.id)}"${c.id === sel ? " selected" : ""}>${esc(c.name)}</option>`).join("")}</optgroup>` : "";
  }).join("");
  const loose = sortedVals(S.creators).filter(c => !S.brands[c.brandId]);
  return `<option value="">Unassigned</option>${groups}${loose.map(c => `<option value="${esc(c.id)}"${c.id === sel ? " selected" : ""}>${esc(c.name)}</option>`).join("")}`;
}
function openDrawer(id) {
  const i = S.ideas[id]; if (!i) return;
  ui.openId = id;
  const pillars = [...new Set(Object.values(S.ideas).map(x => x.pillar).filter(Boolean))].sort();
  const opt = (obj, sel) => Object.entries(obj).map(([k, v]) => `<option value="${k}"${k === sel ? " selected" : ""}>${esc(typeof v === "string" ? v : v.label)}</option>`).join("");
  $("drawer").innerHTML = `
    <div class="drawer-bar">
      <button class="btn" type="button" data-close>Close</button>
      <span><button class="btn" type="button" id="d-duplicate">Duplicate</button><button class="btn danger" type="button" id="d-delete">Delete idea</button></span>
    </div>
    <div class="drawer-body">
      <textarea class="d-title" id="d-title" rows="1" placeholder="Untitled">${esc(i.title)}</textarea>
      <div class="props">
        <label for="d-date">Post date</label><input class="prop" id="d-date" type="date" value="${esc(i.date)}">
        <label for="d-creator">Creator</label><select class="prop" id="d-creator">${creatorOptions(i.creatorId)}</select>
        <label for="d-brand">Brand</label><select class="prop" id="d-brand"><option value="">No brand</option>${sortedVals(S.brands).map(b => `<option value="${esc(b.id)}"${b.id === i.brandId ? " selected" : ""}>${esc(b.name)}</option>`).join("")}</select>
        <label for="d-pillar">Content pillar</label><input class="prop" id="d-pillar" list="pillar-list" value="${esc(i.pillar)}" placeholder="Empty"><datalist id="pillar-list">${pillars.map(p => `<option value="${esc(p)}"></option>`).join("")}</datalist>

/* ---------- reading on-screen text from screenshots and videos ---------- */
let sampleFn = null, ocrMode = "none", maxImages = 8, ocrBusy = false;
const OCR_PROMPT = "You are reading the on-screen text of social media posts (TikTok or Instagram slideshows and videos) so it can be saved into a content plan. " +
  "For each image below, in order, transcribe the overlay text the creator put on the picture exactly as written: keep the wording, capitalisation, line breaks and emoji. " +
  "Ignore platform interface text such as usernames, follower or like counts, the caption under the post, music labels, buttons and timestamps. " +
  "Frames from the same video often repeat the same text: include each distinct text only once, in order. Skip images with no overlay text. " +
  'Reply with only JSON in this shape: {"slides": ["text of the first slide", "text of the next slide"]}\n\n';
async function initOcr() {
  if (window.claude && claude.use) {
    try { sampleFn = await claude.use("sample"); } catch (e) { sampleFn = null; }
    if (sampleFn) {
      const l = await sampleFn.limits().catch(() => null);
      if (l && l.images) { ocrMode = "claude"; maxImages = l.images.maxCount || 8; }
    }
  } else ocrMode = "tesseract";
  renderOcrBox(); renderQuickHint();
}
function renderOcrBox() {
  const box = $("d-ocr"); if (!box) return;
  box.hidden = ocrMode === "none";
  box.innerHTML = ocrBusy ? `<span class="busy">Reading the text on screen…</span>` :
    `<span>Paste a screenshot (Ctrl+V), drop files here, or</span><label for="d-ocr-file">choose images or a video</label><span>to copy the on-screen text into slides.</span><input type="file" id="d-ocr-file" accept="image/*,video/*" multiple>`;
}
function renderQuickHint() {
  $("quick-hint").textContent = ocrBusy ? "Reading the text on screen…" : "Enter to add, Shift+Enter for a new line";
}
function setOcrBusy(v) { ocrBusy = v; renderOcrBox(); renderQuickHint(); }
async function videoFrames(file, n = 4) {
  const url = URL.createObjectURL(file);
  try {
    const v = document.createElement("video");
    v.muted = true; v.playsInline = true; v.preload = "auto"; v.src = url;
    await new Promise((res, rej) => { v.onloadeddata = res; v.onerror = () => rej(new Error("video")); });
    const c = document.createElement("canvas");
    const scale = Math.min(1, 1280 / Math.max(v.videoWidth, v.videoHeight));
    c.width = Math.round(v.videoWidth * scale); c.height = Math.round(v.videoHeight * scale);
    const out = [];
    for (let k = 0; k < n; k++) {
      await new Promise(r => { v.onseeked = r; v.currentTime = (v.duration || 1) * (k + 0.5) / n; });
      c.getContext("2d").drawImage(v, 0, 0, c.width, c.height);
      out.push(await new Promise(r => c.toBlob(r, "image/jpeg", 0.85)));
    }
    return out.filter(Boolean);
  } finally { URL.revokeObjectURL(url); }
}
function loadTesseract() {
  if (window.Tesseract) return Promise.resolve();
  return new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";
    s.onload = res; s.onerror = rej; document.head.appendChild(s);
  });
}
async function extractText(files) {
  const imgs = [];
  for (const f of files) {
    if (f.type.startsWith("video/")) (await videoFrames(f)).forEach(b => imgs.push({ blob: b, video: f.name || "video" }));
    else if (f.type.startsWith("image/")) imgs.push({ blob: f });
  }
  if (!imgs.length) return [];
  if (ocrMode === "claude") {
    if (imgs.length > maxImages) toast(`Only the first ${maxImages} images were read.`);
    const use = imgs.slice(0, maxImages);
    const desc = use.map((m, k) => `Image ${k + 1}: ${m.video ? "a frame from the video " + m.video : "a screenshot"}`).join("\n");
    const res = await sampleFn.json(OCR_PROMPT + desc, { images: use.map(m => m.blob) });
    return (res && Array.isArray(res.slides) ? res.slides : []).map(s => String(s).trim()).filter(Boolean);
  }
  await loadTesseract();
  const out = [];
  for (const m of imgs) {
    const r = await Tesseract.recognize(m.blob, "eng");
    const t = r.data.text.trim();
    if (t && out[out.length - 1] !== t) out.push(t);
  }
  return out;
}
async function handleFiles(files, target) {
  files = [...files].filter(f => /^(image|video)\//.test(f.type));
  if (!files.length) return;
  if (ocrMode === "none") { toast("Reading text from images isn't available here."); return; }
  if (ocrBusy) { toast("Still reading the last one…"); return; }
  if (ui.mode === "loading") return;
  setOcrBusy(true);
  try {
    const found = await extractText(files);
    if (!found.length) { toast("No on-screen text found in that file."); return; }
    if (target === "drawer" && ui.openId && S.ideas[ui.openId]) {
      flushDrawer();
      const cur = currentSlides();
      while (cur.length && !cur[cur.length - 1].trim()) cur.pop();
      const slides = cur.concat(found);
      patch("ideas", ui.openId, { slides });
      renderSlides(slides);
      toast(found.length === 1 ? "Added 1 slide" : `Added ${found.length} slides`);
    } else {
      const title = found[0].split("\n")[0].slice(0, 70);
      const idea = newIdea({ title, slides: found });
      put("ideas", idea); ui.tab = "un"; syncTabs(); renderList(); openDrawer(idea.id);
      toast(`New idea with ${found.length} slide${found.length === 1 ? "" : "s"}`);
    }
  } catch (e) {
    const code = e && e.code;
    if (code === "cancelled") return;
    if (code === "not_granted" || code === "sampling_disabled" || code === "images_unavailable") { ocrMode = "none"; renderOcrBox(); toast("Reading text needs Claude to be allowed on this page."); }
    else if (code === "rate_limited") toast("Too many requests right now. Try again in a minute.");
    else if (code === "image_rejected") toast("That file couldn't be read. Try a PNG or JPG screenshot.");
    else if (e && e.message === "video") toast("Couldn't open that video. Paste a screenshot of it instead.");
    else toast("Couldn't read the text. Try again.");

}
document.addEventListener("paste", e => {

document.addEventListener("dragover", e => {

$("quick-add").addEventListener("click", quickAdd);
$("search").addEventListener("input", e => { ui.q = e.target.value.trim(); renderList(); renderCalendar(); });
function syncTabs() { $("tab-un").setAttribute("aria-pressed", ui.tab === "un"); $("tab-all").setAttribute("aria-pressed", ui.tab === "all"); }
$("tab-un").addEventListener("click", () => { ui.tab = "un"; syncTabs(); renderList(); });
$("tab-all").addEventListener("click", () => { ui.tab = "all"; syncTabs(); renderList(); });
function shift(n) {
  const c = ui.cursor;
  ui.cursor = ui.view === "month" ? new Date(c.getFullYear(), c.getMonth() + n, 1) : addDays(c, 7 * n);
  renderCalendar();
}
$("prev").addEventListener("click", () => shift(-1));
$("next").addEventListener("click", () => shift(1));
$("today").addEventListener("click", () => { ui.cursor = startOfDay(new Date()); renderCalendar(); });
function setView(v) { ui.view = v; $("v-month").setAttribute("aria-pressed", v === "month"); $("v-week").setAttribute("aria-pressed", v === "week"); try { localStorage.setItem("batchbook-view", v); } catch (e) {} renderCalendar(); }
$("v-month").addEventListener("click", () => setView("month"));
$("v-week").addEventListener("click", () => setView("week"));
$("f-brand").addEventListener("change", e => { ui.brand = e.target.value; if (ui.creator && S.creators[ui.creator]?.brandId !== ui.brand && ui.brand) ui.creator = ""; renderAll(); });
$("f-creator").addEventListener("change", e => { ui.creator = e.target.value; renderAll(); });
$("f-sell").addEventListener("change", e => { ui.sell = e.target.value; renderAll(); });
$("open-settings").addEventListener("click", openSettings);
$("mode").addEventListener("click", e => { if (e.target.closest("[data-open-settings]")) openSettings(); });
$("scrim").addEventListener("click", () => { if (!$("settings").hidden) closeSettings(); else closeDrawer(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") { if (!$("menu").hidden) closeMenu(); else if (!$("settings").hidden) closeSettings(); else if (ui.openId) closeDrawer(); } });

$("sort").addEventListener("change", e => { ui.sort = e.target.value; try { localStorage.setItem("batchbook-sort", ui.sort); } catch (err) {} renderList(); });
try { const v = localStorage.getItem("batchbook-view"); if (v === "week") setView("week"); } catch (e) {}
try { const s = localStorage.getItem("batchbook-sort"); if (s && $("sort").querySelector(`option[value="${s}"]`)) { ui.sort = s; $("sort").value = s; } } catch (e) {}
boot();
initOcr();
</script>

</body>
</html>
